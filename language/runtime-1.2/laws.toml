# Natural-number arithmetic over the runtime's `multiply`, `quotient`,
# `remainder`, and `subtract` (PF-28), stated as a document writes them so that
# each law matches without unfolding. A `law` proof applies one; `simplify`
# also accepts each by its Lean name as a rewrite. Every quotient and
# remainder law takes a positive divisor, so it holds for every zero case,
# which is an explicit argument; a zero case on the right side is one of the
# left side's, so that simplify instantiates it. The arguments follow the
# theorem's binders: the operands, then the zero cases.

# a * b = b * a.
[[law]]
name = "nat_mul_comm"
lean = "LexLeanLaws.nat_mul_comm"
type_parameters = []
premises = 0
parameters = [{ kind = "nat" }, { kind = "nat" }]

# (a * b) * c = a * (b * c).
[[law]]
name = "nat_mul_assoc"
lean = "LexLeanLaws.nat_mul_assoc"
type_parameters = []
premises = 0
parameters = [{ kind = "nat" }, { kind = "nat" }, { kind = "nat" }]

# a * (b * c) = b * (a * c).
[[law]]
name = "nat_mul_left_comm"
lean = "LexLeanLaws.nat_mul_left_comm"
type_parameters = []
premises = 0
parameters = [{ kind = "nat" }, { kind = "nat" }, { kind = "nat" }]

# a * (b + c) = a * b + a * c.
[[law]]
name = "nat_left_distrib"
lean = "LexLeanLaws.nat_left_distrib"
type_parameters = []
premises = 0
parameters = [{ kind = "nat" }, { kind = "nat" }, { kind = "nat" }]

# (a + b) * c = a * c + b * c.
[[law]]
name = "nat_right_distrib"
lean = "LexLeanLaws.nat_right_distrib"
type_parameters = []
premises = 0
parameters = [{ kind = "nat" }, { kind = "nat" }, { kind = "nat" }]

# a * (b - c) = a * b - a * c, in truncated subtraction.
[[law]]
name = "nat_mul_sub"
lean = "LexLeanLaws.nat_mul_sub"
type_parameters = []
premises = 0
parameters = [{ kind = "nat" }, { kind = "nat" }, { kind = "nat" }]

# a * 1 = a.
[[law]]
name = "nat_mul_one"
lean = "LexLeanLaws.nat_mul_one"
type_parameters = []
premises = 0
parameters = [{ kind = "nat" }]

# 1 * a = a.
[[law]]
name = "nat_one_mul"
lean = "LexLeanLaws.nat_one_mul"
type_parameters = []
premises = 0
parameters = [{ kind = "nat" }]

# a * 0 = 0.
[[law]]
name = "nat_mul_zero"
lean = "LexLeanLaws.nat_mul_zero"
type_parameters = []
premises = 0
parameters = [{ kind = "nat" }]

# 0 * a = 0.
[[law]]
name = "nat_zero_mul"
lean = "LexLeanLaws.nat_zero_mul"
type_parameters = []
premises = 0
parameters = [{ kind = "nat" }]

# a * (b + 1) = a * b + a.
[[law]]
name = "nat_mul_succ"
lean = "LexLeanLaws.nat_mul_succ"
type_parameters = []
premises = 0
parameters = [{ kind = "nat" }, { kind = "nat" }]

# a <= b and c <= d give a * c <= b * d.
[[law]]
name = "nat_mul_le_mul"
lean = "LexLeanLaws.nat_mul_le_mul"
type_parameters = []
premises = 2
parameters = [{ kind = "nat" }, { kind = "nat" }, { kind = "nat" }, { kind = "nat" }]

# a < b and 0 < c give a * c < b * c.
[[law]]
name = "nat_mul_lt_mul_of_pos_right"
lean = "LexLeanLaws.nat_mul_lt_mul_of_pos_right"
type_parameters = []
premises = 2
parameters = [{ kind = "nat" }, { kind = "nat" }, { kind = "nat" }]

# c * a <= c * b and 0 < c give a <= b.
[[law]]
name = "nat_le_of_mul_le_mul_left"
lean = "LexLeanLaws.nat_le_of_mul_le_mul_left"
type_parameters = []
premises = 2
parameters = [{ kind = "nat" }, { kind = "nat" }, { kind = "nat" }]

# 0 < c gives c * a <= c * b exactly when a <= b. The rewrite form of the
# cancellation above, whose factor c its conclusion does not contain, so that
# simplify cannot instantiate it.
[[law]]
name = "nat_mul_le_mul_left_iff"
lean = "LexLeanLaws.nat_mul_le_mul_left_iff"
type_parameters = []
premises = 1
parameters = [{ kind = "nat" }, { kind = "nat" }, { kind = "nat" }]

# 0 < b gives (b * a) / b = a, whatever the zero case z.
[[law]]
name = "nat_mul_div_cancel_left"
lean = "LexLeanLaws.nat_mul_div_cancel_left"
type_parameters = []
premises = 1
parameters = [{ kind = "nat" }, { kind = "nat" }, { kind = "nat" }]

# 0 < b and 0 < c give (a / b) / c = a / (b * c), the right side with the
# outer zero case.
[[law]]
name = "nat_div_div_eq_div_mul"
lean = "LexLeanLaws.nat_div_div_eq_div_mul"
type_parameters = []
premises = 2
parameters = [{ kind = "nat" }, { kind = "nat" }, { kind = "nat" }, { kind = "nat" }, { kind = "nat" }]

# 0 < k gives (k * a) / (k * b) = a / b, both with the zero case z.
[[law]]
name = "nat_mul_div_mul_left"
lean = "LexLeanLaws.nat_mul_div_mul_left"
type_parameters = []
premises = 1
parameters = [{ kind = "nat" }, { kind = "nat" }, { kind = "nat" }, { kind = "nat" }]

# 0 < b gives b * (a / b) + a % b = a.
[[law]]
name = "nat_div_add_mod"
lean = "LexLeanLaws.nat_div_add_mod"
type_parameters = []
premises = 1
parameters = [{ kind = "nat" }, { kind = "nat" }, { kind = "nat" }, { kind = "nat" }]

# 0 < b gives (b * a) % b = 0.
[[law]]
name = "nat_mul_mod_left"
lean = "LexLeanLaws.nat_mul_mod_left"
type_parameters = []
premises = 1
parameters = [{ kind = "nat" }, { kind = "nat" }, { kind = "nat" }]

# 0 < b and 0 < c give (a % (b * c)) / b = (a / b) % c: the bits between two
# shifts. The right side's quotient takes the left's quotient zero case, and
# its remainder the left's remainder zero case.
[[law]]
name = "nat_mod_mul_left_div_self"
lean = "LexLeanLaws.nat_mod_mul_left_div_self"
type_parameters = []
premises = 2
parameters = [{ kind = "nat" }, { kind = "nat" }, { kind = "nat" }, { kind = "nat" }, { kind = "nat" }]

# 0 < b gives (a + b * c) / b = a / b + c, both with the zero case z.
[[law]]
name = "nat_add_mul_div_left"
lean = "LexLeanLaws.nat_add_mul_div_left"
type_parameters = []
premises = 1
parameters = [{ kind = "nat" }, { kind = "nat" }, { kind = "nat" }, { kind = "nat" }]

# 0 < b gives a % b < b.
[[law]]
name = "nat_mod_lt"
lean = "LexLeanLaws.nat_mod_lt"
type_parameters = []
premises = 1
parameters = [{ kind = "nat" }, { kind = "nat" }, { kind = "nat" }]
