# Optional, manual *nonqualifying* development feedback (CI Phase B, #603).
# This is not SPEC.md §9.4's ci.yml or reproducibility.yml. It may not satisfy
# required checks, release evidence, or a ready PR's exact-head acceptance.
# No push trigger. PR 'edited' is an explicit, draft-only, one-time opt-in;
# normal pushes, synchronizations and PR opening do not dispatch a runner.
name: CI development feedback (NONQUALIFYING)

on:
  pull_request:
    types: [edited]
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Trusted baseline branch (main or release/vX.Y)"
        required: true
        type: string
        default: "release/v0.4"

permissions:
  contents: read

concurrency:
  group: ci-development-feedback-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: nonqualifying selected checks
    # A fresh workflow_dispatch can run once this file is on default.
    # Until then, one owner-authored PR body edit with the exact leading
    # marker triggers a bounded draft-only diagnostic, never merge proof.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository && (startsWith(github.event.pull_request.body, '<!-- ci-preview-once -->') || startsWith(github.event.pull_request.body, '<!-- ci-preview-once: head-only -->'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Draft-only cost experiment: query a live ref with an explicit 5s limit.
      # Never substitute this for the exact-head and ancestry checks below.
      - name: Bounded stale-base preflight before checkout
        shell: bash
        env:
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha || '' }}
          BASE_REF: ${{ github.event.pull_request.base.ref || inputs.base_ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A manual dispatch has no event-base SHA; it still checks post-checkout.
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            if [[ ! "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ||
                  ! "$BASE_REF" =~ ^(main|release/v[0-9]+\.[0-9]+)$ ||
                  ! "$EXPECTED_BASE" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Untrusted preflight ref or event commit"
              exit 1
            fi
            payload="$(curl --silent --show-error --fail --retry 0 \
              --connect-timeout 2 --max-time 5 --max-filesize 65536 \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/$BASE_REF")" || {
              echo "::error::Bounded base-ref lookup failed; no checkout attempted"
              exit 1
            }
            live_sha="$(printf '%s' "$payload" | python3 -c \
              'import json,os,sys; x=json.load(sys.stdin); want="refs/heads/"+os.environ["BASE_REF"]; \
              assert isinstance(x,dict) and x.get("ref")==want and x.get("object",{}).get("type")=="commit"; \
              print(x["object"]["sha"])')" || {
              echo "::error::Malformed base-ref response; no checkout attempted"
              exit 1
            }
            if [[ ! "$live_sha" =~ ^[0-9a-f]{40}$ || "$live_sha" != "$EXPECTED_BASE" ]]; then
              echo "::error::Base moved or untrusted SHA; refusing before checkout"
              exit 1
            fi
          fi
      # Checkout A/B is selected only by a direct one-time DRAFT PR edit.
      # Both paths verify the exact head + the same complete base ancestry.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name != 'pull_request' || !startsWith(github.event.pull_request.body, '<!-- ci-preview-once: head-only -->') }}
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          # Existing baseline: full ancestry, Git object blobs fetched lazily.
          filter: blob:none
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name == 'pull_request' && startsWith(github.event.pull_request.body, '<!-- ci-preview-once: head-only -->') }}
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Candidate: retrieve the exact commit without all remote refs.
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
      - name: Restore complete exact-head ancestry for head-only checkout
        if: ${{ github.event_name == 'pull_request' && startsWith(github.event.pull_request.body, '<!-- ci-preview-once: head-only -->') }}
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ && "$EXPECTED_BASE" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_HEAD"
          # Bounded second Git read; failure prevents the normal diff planner.
          timeout 120 git -c protocol.version=2 fetch --no-tags --filter=blob:none --unshallow origin "$EXPECTED_HEAD"
          test "$(git rev-parse --is-shallow-repository)" = false
          git merge-base --is-ancestor "$EXPECTED_BASE" "$EXPECTED_HEAD" || {
            echo "::error::Head ancestry does not contain the exact event base"
            exit 1
          }
      - name: Pin trusted-base comparison and decide real feedback commands
        id: plan
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || inputs.base_ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          # User input is data, not a shell command or a revision expression.
          if [[ ! "$BASE_REF" =~ ^(main|release/v[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Only main or release/vX.Y baselines are supported"
            exit 1
          fi
          head_sha="$(git rev-parse --verify HEAD)"
          if [[ "$head_sha" != "$EXPECTED_HEAD" ]]; then
            echo "::error::Checkout SHA differs from dispatch SHA"
            exit 1
          fi
          git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
          base_sha="$(git rev-parse --verify "refs/remotes/origin/$BASE_REF^{commit}")"
          if [[ -n "$EXPECTED_BASE" && "$base_sha" != "$EXPECTED_BASE" ]]; then
            echo "::error::Base branch moved since the opted-in event"
            exit 1
          fi
          # Do not silently compare a stale or unrelated branch.
          git merge-base --is-ancestor "$base_sha" "$head_sha" || {
            echo "::error::Base is not an ancestor: update branch before preview"
            exit 1
          }
          git diff --name-status -z -M --no-ext-diff "$base_sha" "$head_sha" > "$RUNNER_TEMP/ci-preview-changes.z"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          python3 .github/scripts/ci_impact_preview.py \
            --base "$base_sha" --head "$head_sha" \
            --diff-nul "$RUNNER_TEMP/ci-preview-changes.z" --repo-root . \
            --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
      - name: Check changed-line whitespace
        if: ${{ steps.plan.outputs.whitespace == 'true' }}
        shell: bash
        env:
          BASE_SHA: ${{ steps.plan.outputs.base_sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --check --no-ext-diff "$BASE_SHA" HEAD
      - name: Run impacted CI Python contracts
        if: ${{ steps.plan.outputs.python_contracts == 'true' }}
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Generate the observed before-after CI report
        if: ${{ steps.plan.outputs.python_contracts == 'true' }}
        run: |
          python3 .github/scripts/ci_metrics_report.py \
            --before-runs .github/metrics/ci-before-pr50-runs.json \
            --before-costs .github/metrics/ci-before-pr50-job-costs.json \
            --output-dir ci-evidence/ci-before-after
      # Replay frozen CI evidence within the existing nonqualifying preview.
      # No extra runner, host matrix, protected status or release authority.
      - name: Validate historical Intel CI evidence
        if: ${{ steps.plan.outputs.python_contracts == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/ci_intel_rebalance.py \
            --evidence .github/metrics/ci-intel-historical-lanes-20261123.json \
            > ci-evidence/ci-before-after/intel-lane-scenarios.json
          python3 .github/scripts/ci_intel_tail_audit.py \
            --ledger .github/metrics/ci-intel-case-tail-20261123.json \
            > ci-evidence/ci-before-after/intel-case-tail.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ steps.plan.outputs.python_contracts == 'true' && success() }}
        with:
          name: ci-before-after-evidence
          path: ci-evidence/ci-before-after
          if-no-files-found: error
          retention-days: 14
      - name: Install pinned Rust for selected checks
        if: ${{ steps.plan.outputs.rust_format == 'true' || steps.plan.outputs.cargo_check == 'true' }}
        run: rustup toolchain install
      - name: Check impacted Rust formatting
        if: ${{ steps.plan.outputs.rust_format == 'true' }}
        run: cargo fmt --all -- --check
      - name: Check actual affected Cargo package targets
        if: ${{ steps.plan.outputs.cargo_check == 'true' }}
        shell: bash
        env:
          MODEL: ${{ steps.plan.outputs.cargo_repo_model }}
          LEXLEAN: ${{ steps.plan.outputs.cargo_lexlean }}
          CONFORMANCE: ${{ steps.plan.outputs.cargo_repo_conformance }}
          XTASK: ${{ steps.plan.outputs.cargo_xtask }}
        run: |
          set -euo pipefail
          packages=()
          [[ "$MODEL" == "true" ]] && packages+=(-p repo-model)
          [[ "$LEXLEAN" == "true" ]] && packages+=(-p lexlean)
          [[ "$CONFORMANCE" == "true" ]] && packages+=(-p repo-conformance)
          [[ "$XTASK" == "true" ]] && packages+=(-p xtask)
          if [[ "${#packages[@]}" -eq 0 ]]; then
            echo "::error::Requested Cargo check without a package"
            exit 1
          fi
          cargo check --all-targets --all-features "${packages[@]}"
      - name: State the assurance boundary even on failure
        if: ${{ always() }}
        shell: bash
        run: |
          {
            printf '\n**NONQUALIFYING:** only the selected development-feedback commands ran. '
            printf 'A green preview does not replace SPEC.md §9.4, native/proof checks, '
            printf 'reproducibility, or the exact-head release gate.\n'
          } | tee -a "$GITHUB_STEP_SUMMARY"
