name: Stop recording workspace reads
description: >-
  Advisory, CI #603 phase 1. Ends the recorder started by `read-trace-start`
  and uploads its inventory as `read-trace-<job>`. Never fails the job.
inputs:
  job:
    description: The artifact suffix, unique within the run.
    required: true
runs:
  using: composite
  steps:
    - name: Stop the read recorder
      shell: bash
      run: |
        set -u
        dir="$RUNNER_TEMP/read-trace"
        if [ ! -s "$dir/ready" ]; then
          echo "::warning::no read recorder ran in this job (advisory, #603)"
          exit 0
        fi
        if sudo -n python3 "$GITHUB_WORKSPACE/.github/scripts/ci_read_trace.py" stop \
          --ready "$dir/ready" --output "$dir/reads.json"; then
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); print("read trace:", "complete" if r["complete"] else "INCOMPLETE", r["counts"], len(r["files"]), "files", len(r["dirs"]), "dirs")' "$dir/reads.json"
        else
          echo "::warning::the read recorder wrote no inventory (advisory, #603)"
          cat "$dir/recorder.log" || true
        fi
        exit 0
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: read-trace-${{ inputs.job }}
        path: ${{ runner.temp }}/read-trace
        if-no-files-found: warn
        retention-days: 14
