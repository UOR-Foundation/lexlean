[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.4.5"
edition = "2021"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/UOR-Foundation/LexLean"
homepage = "https://github.com/UOR-Foundation/LexLean"
authors = ["Alex Flom"]
keywords = ["lean", "latex", "formal-methods", "compiler", "proof"]
categories = ["compilers", "development-tools"]

[workspace.dependencies]
# A `path` dependency with no `version` is a wildcard requirement, and
# `cargo deny` refuses those (`wildcards = "deny"`). Every internal dependency
# carries both.
repo-model = { version = "0.4.5", path = "crates/model" }
repo-conformance = { version = "0.4.5", path = "crates/conformance" }
lexlean = { version = "0.4.5", path = "crates/lexlean" }

camino = "1.2"
clap = { version = "4.5", features = ["derive"] }
fs4 = { version = "0.13", features = ["sync"] }
proptest = "1.6"
rustix = { version = "1", default-features = false, features = ["std", "process"] }
same-file = "1.0"
semver = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
# The oracles of the compiler's κ-label (SPEC.md §21.1, `SL-06`): the reference
# BLAKE3 in the release the Hologram workspace and uor-addr lock, and uor-addr's
# `blake3` σ-axis (below), which Hologram's store re-derives. They may falsify the
# certified package and never establish it. Dev and CI only, through
# `repo-conformance` and `repo-model`; never a dependency of a shipped crate.
blake3 = "=1.5.5"
sha2 = "0.10"
signal-hook = { version = "0.3", default-features = false, features = ["iterator"] }
tempfile = "3"
thiserror = "2"
toml = "0.8"
unicode-normalization = "0.1"
# uor-addr is also the oracle of the `kappa` package (SPEC.md §17.22,
# `KA-02`..`KA-08`): the JSON, GGUF, and ONNX realizations; `gguf` and `onnx`
# add only `uor-prism-tensor` (MIT), already in the graph through `uor-prism`.
# Dev and CI only, through `repo-conformance` and `repo-model`; never a
# dependency of a shipped crate.
uor-addr = { version = "=0.2.0", default-features = false, features = ["std", "gguf", "onnx"] }
walkdir = "2"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Hashing is the one place unoptimized code costs seconds rather than
# milliseconds: every verification reads the running executable (a debug
# executable is a few hundred megabytes) and every olean, and the build script
# hashes the compiler's driver library. The certified BLAKE3 package (SPEC.md
# §17.22) is a module of the `lexlean` crate and of its build script, and a
# module cannot be optimized apart from its crate, so both are optimized in
# the dev profile; `sha2` stays optimized for the release checksums xtask
# writes. The levels change no value anything computes.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.lexlean]
opt-level = 1

[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3

# Backtraces keep their file and line, which is all a failing gate needs from
# debug information. Full variable-level information doubled the size of every
# test binary (the conformance binary: 279 MB, 136 MB with this) and a cold
# build of the workspace's tests took 86 s against 61 s (the test profile
# inherits this one), on a runner whose disk also holds the proof evidence.
[profile.dev]
debug = "line-tables-only"
