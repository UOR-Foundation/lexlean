[package]
name = "xtask"
description = "Repository gates: validate-model, validate-spec-links, verify-examples, check-golden, check-reproducibility, check-fixtures, check-calculus, check-production-export, export-bootstrap, check-freshness, check-package, counts, check-test-inventory, bdd, ci-summary, ci-hints, ci-shards, release-artifacts, release-check, runtime-package, bump-version, validate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
camino = { workspace = true }
flate2 = "=1.1.9"
lexlean = { workspace = true }
repo-conformance = { workspace = true }
repo-model = { workspace = true }
# The release checksums are SHA-256 because crates.io and `sha256sum`, the
# external formats they are read by, require it (SPEC.md §30.3); nothing else
# in the repository tooling is a SHA-256.
sha2 = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tar = { version = "=0.4.46", default-features = false }
toml = { workspace = true }
walkdir = { workspace = true }

[lints]
workspace = true
